<div class="table-container">
  <h2>Lista Utenti</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Lavoro</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of utenti">
        <td>{{ u.id }}</td>
        <td>{{ u.name }}</td>
        <td>
          <span class="badge">{{ u.job }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
